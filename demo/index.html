<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e13" />
    <title>MyAthanor（見本）</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231b1308'/%3E%3Cpath d='M4 6h8v1H4zM3 7h10v2H3zM4 9h8v2H4zM6 11h4v1H6z' fill='%23e6bb56'/%3E%3Cpath d='M5 4h6v2H5z' fill='%239c7325'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      /* 見本であることの断り。中身は本物と同じなので、ここで区別を付けておく。 */
      .demo-banner {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px var(--pad);
        padding-top: max(7px, env(safe-area-inset-top));
        background: #33260f;
        border-bottom: 1px solid var(--edge);
        box-shadow: inset 0 -1px 0 var(--gold-deep);
      }

      .demo-banner p {
        flex: 1;
        margin: 0;
        font-family: var(--sans);
        font-size: 11px;
        line-height: 1.45;
        color: var(--dim);
      }

      .demo-banner b {
        font-weight: 400;
        color: var(--gold);
      }

      .demo-banner button {
        flex: none;
        padding: 5px 9px;
        font-size: 11px;
        letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="demo-banner" id="demo-banner">
        <p><b>見本</b>／データはこの端末だけに残ります</p>
        <button type="button">最初に戻す</button>
      </div>
      <header class="topbar" id="topbar"></header>
      <main class="view" id="view"></main>
      <div class="pager" id="pager" hidden>
        <button class="pager-arrow" id="page-prev" aria-label="前のページ">◀</button>
        <span class="pager-count" id="page-count"></span>
        <button class="pager-arrow" id="page-next" aria-label="次のページ">▶</button>
      </div>
      <nav class="tabs" id="tabs">
        <a class="tab" data-tab="home" href="#/home">
          <span class="tab-mark" data-icon="shield"></span><span class="tab-label">ホーム</span>
        </a>
        <a class="tab" data-tab="stream" href="#/stream">
          <span class="tab-mark" data-icon="book"></span><span class="tab-label">ストリーム</span>
        </a>
        <a class="tab" data-tab="missions" href="#/missions">
          <span class="tab-mark" data-icon="parchment"></span><span class="tab-label">ミッション</span>
        </a>
        <a class="tab" data-tab="dungeon" href="#/dungeon">
          <span class="tab-mark" data-icon="gate"></span><span class="tab-label">ダンジョン</span>
        </a>
      </nav>
    </div>
    <button class="fab" id="fab" aria-label="書き留める"></button>
    <div class="toast" id="toast" hidden></div>

    <script src="./demo/sql-wasm.js"></script>
    <script type="importmap">
      { "imports": { "express": "./demo/express.js" } }
    </script>
    <script type="module" src="./demo/main.js"></script>
  </body>
</html>
