<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e13" />
    <title>MyAthanor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar" id="topbar"></header>
      <main class="view" id="view"></main>
      <nav class="tabs" id="tabs">
        <a class="tab" data-tab="home" href="#/home">
          <span class="tab-mark" data-icon="shield"></span><span class="tab-label">ホーム</span>
        </a>
        <a class="tab" data-tab="stream" href="#/stream">
          <span class="tab-mark" data-icon="book"></span><span class="tab-label">ストリーム</span>
        </a>
        <a class="tab" data-tab="missions" href="#/missions">
          <span class="tab-mark" data-icon="parchment"></span><span class="tab-label">ミッション</span>
        </a>
        <a class="tab" data-tab="dungeon" href="#/dungeon">
          <span class="tab-mark" data-icon="gate"></span><span class="tab-label">ダンジョン</span>
        </a>
      </nav>
    </div>
    <div class="toast" id="toast" hidden></div>
    <div class="update-badge" id="update-badge" hidden>
      <span>アップデートが利用可能です</span>
      <button id="update-btn">更新</button>
    </div>
    <script type="module" src="/app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });

          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                document.getElementById('update-badge').hidden = false;
                document.getElementById('update-btn').onclick = () => {
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                };
              }
            });
          });

          setInterval(() => {
            reg.update();
          }, 30000);
        });
      }
    </script>
  </body>
</html>
